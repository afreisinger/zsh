"$schema" = 'https://starship.rs/config-schema.json'

# Prompt: directory / os / git a la izquierda, lenguajes + tiempo a la derecha
format = """\
($directory$os$git_branch$git_status)\
$fill\
$nodejs$rust$golang$php$python$cmd_duration$time\
$line_break$character"""

add_newline = true

palette = "gentleman"

[palettes.gentleman]
text      = "#F3F6F9"
red       = "#CB7C94"
green     = "#B7CC85"
yellow    = "#FFE066"
blue      = "#7FB4CA"
mauve     = "#A3B5D6"
pink      = "#FF8DD7"
teal      = "#7AA89F"
peach     = "#DEBA87"
subtext0  = "#5C6170"
overlay0  = "#232A40"
base      = "none"
mantle    = "#06080f"
crust     = "#06080f"

[fill]
symbol = ' '

[username]
style_user  = 'bold blue'
style_root  = 'bold red'
format      = '[ $user](fg:$style) '
disabled    = false
show_always = true

[os]
disabled = true

[character]
success_symbol          = '[󱗞 ](fg:green)'
error_symbol            = '[󱗞 ](fg:red)'
vimcmd_symbol           = '[N](bold red)'
vimcmd_replace_one_symbol = '[R](bold peach)'
vimcmd_visual_symbol    = '[V](bold mauve)'

[directory]
format               = "[$path](bold $style)[$read_only]($read_only_style) "
truncation_length    = 2
style                = "fg:blue"
read_only            = "  "
read_only_style      = "fg:blue"
truncation_symbol    = "…/"
truncate_to_repo     = true

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music"     = " "
"Pictures"  = " "

[git_branch]
symbol = " "
format = "[$symbol$branch](bold fg:mauve) "

[git_status]
format     = "[$all_status$ahead_behind ](fg:text bg:pink)"
ahead      = "[⇡$count ](bold cyan)"
behind     = "[⇣$count ](bold cyan)"
diverged   = "[⇡$ahead_count⇣$behind_count ](bold cyan)"
staged     = "[+$count ](bold green)"
modified   = "[●$count ](bold yellow)"
untracked  = "[?$count ](bold white)"
deleted    = "[✘$count ](bold red)"
conflicted = "[⚡$count ](bold red)"

[cmd_duration]
min_time = 500
format   = " took [ $duration](bold fg:yellow) "

[time]
disabled    = false
time_format = "%R"
format      = "[[  $time ](fg:subtext0)]($style) "

[python]
symbol = " "
format = "[$symbol$pyenv_prefix($version)( $virtualenv)](fg:peach)"

[nodejs]
symbol = " "
format = "[[ $symbol ($version) ](fg:green)]($style) "

[rust]
symbol = " "
format = "[[ $symbol ($version) ](fg:red)]($style) "

[golang]
symbol = " "
format = "[[ $symbol ($version) ](fg:teal)]($style) "

[php]
symbol = " "
format = "[[ $symbol ($version) ](fg:peach)]($style) "