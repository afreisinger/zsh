# =========================================================
# Starship prompt
# Docs: https://starship.rs/config/
# =========================================================

"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$cmd_duration\
$line_break\
$character"""

# No blank line between prompts
add_newline = false

[character]
success_symbol = '[❯](bold green)'
error_symbol   = '[❯](bold red)'

[directory]
truncation_length    = 4
truncate_to_repo     = true
style                = 'bold blue'
read_only            = ' '

[git_branch]
symbol = ' '
style  = 'bold purple'

[git_status]
style     = 'bold red'
ahead     = '⇡${count}'
behind    = '⇣${count}'
diverged  = '⇕⇡${ahead_count}⇣${behind_count}'
modified  = '!${count}'
untracked = '?${count}'
staged    = '+${count}'
deleted   = '✘${count}'

[cmd_duration]
min_time           = 2000
format             = 'took [$duration](bold yellow) '
show_milliseconds  = false

[python]
symbol = ' '

[nodejs]
symbol = ' '

[rust]
symbol = ' '

[golang]
symbol = ' '
